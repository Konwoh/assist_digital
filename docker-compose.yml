services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      HF_HOME: /app/.cache/huggingface
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./chromadb:/app/chromadb
      - ./logs:/app/logs
      - hf-cache:/app/.cache/huggingface
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  ingest:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      HF_HOME: /app/.cache/huggingface
      PYTHONPATH: /app
    volumes:
      - ./chromadb:/app/chromadb
      - ./logs:/app/logs
      - hf-cache:/app/.cache/huggingface
    command: python -m backend.ingestion.load_data

volumes:
  hf-cache:
